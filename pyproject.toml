[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tallowmark"
version = "1.0.0"
description = "Candle dip counter, wax batch notes and cure countdown tracker"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []
keywords = ["cli", "argparse", "command-line", "candle", "candlemaking", "tracker"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]

[project.scripts]
tallowmark = "tallowmark:main"

[tool.setuptools]
py-modules = ["tallowmark"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
